<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-label="Cantila clear-space spec">
  <title>Cantila — clear space specification</title>
  <defs>
    <pattern id="dot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2b2d36"/>
    </pattern>
  </defs>
  <!-- backdrop -->
  <rect width="480" height="320" fill="#0b0c0e"/>
  <rect width="480" height="320" fill="url(#dot-grid)"/>

  <!-- center the spec -->
  <g transform="translate(160 80)">
    <!-- clear-space halo: 25% of mark width on every side -->
    <rect
      x="-40" y="-40" width="240" height="240"
      fill="none"
      stroke="#5f626c"
      stroke-width="1"
      stroke-dasharray="4 4"
    />
    <!-- the mark, 160×160 -->
    <rect width="160" height="160" rx="35" fill="#1a1c22"/>
    <g transform="translate(0 0) scale(5)">
      <path d="M16 2.5 L24 11 L8 11 Z" fill="#ff8159"/>
      <path d="M8 11 L24 11 L24 21 L8 21 Z" fill="#ff6a3d"/>
      <path d="M8 21 L24 21 L16 29.5 Z" fill="#bd4d2b"/>
      <path d="M16 2.5 L24 11 L24 21 L16 29.5 L8 21 L8 11 Z"
            fill="none" stroke="#1a0e08" stroke-width="0.6" stroke-linejoin="round"/>
      <line x1="16" y1="2.5" x2="16" y2="29.5" stroke="#1a0e08" stroke-width="0.35" opacity="0.5"/>
    </g>
    <!-- corner ticks indicating 25% -->
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#9a9ca6">
      <text x="-40" y="-46" letter-spacing="1.5">25% · 40 PX</text>
      <text x="160" y="220" text-anchor="end" letter-spacing="1.5">CLEAR SPACE = 0.25 × MARK WIDTH</text>
    </g>
  </g>

  <!-- caption -->
  <text x="240" y="290" text-anchor="middle"
    font-family="'Switzer', ui-sans-serif, system-ui, sans-serif"
    font-size="13" fill="#9a9ca6">
    Minimum clear space on every side. Minimum mark size: 16 px.
  </text>
</svg>
