<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32" role="img" aria-label="Cantila">
  <title>Cantila</title>
  <!-- backplate: warm-charcoal surface tile, same family as the Console -->
  <rect width="32" height="32" rx="7" fill="#1a1c22"/>
  <!-- ember crystal — three faceted bands -->
  <!-- crown / top face -->
  <path d="M16 2.5 L24 11 L8 11 Z" fill="#ff8159"/>
  <!-- girdle / middle belt -->
  <path d="M8 11 L24 11 L24 21 L8 21 Z" fill="#ff6a3d"/>
  <!-- pavilion / bottom face -->
  <path d="M8 21 L24 21 L16 29.5 Z" fill="#bd4d2b"/>
  <!-- silhouette edge -->
  <path d="M16 2.5 L24 11 L24 21 L16 29.5 L8 21 L8 11 Z"
        fill="none" stroke="#1a0e08" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- inner vertical facet line — gives the crystal-feel at all sizes -->
  <line x1="16" y1="2.5" x2="16" y2="29.5" stroke="#1a0e08" stroke-width="0.35" opacity="0.5"/>
</svg>
